<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="一个功能强大的 Vue.js 照片管理系统，支持 Live Photo、元数据展示、时间轴浏览">
  <meta name="keywords" content="照片管理, Vue.js, Live Photo, 时光轴, 图片浏览">
  <meta name="author" content="Vue Photo Gallery">
  
  <!-- Open Graph -->
  <meta property="og:title" content="Vue Photo Gallery - 照片时光机">
  <meta property="og:description" content="专业的照片管理系统，支持 Live Photo、元数据展示、时间轴浏览">
  <meta property="og:type" content="website">
  <meta property="og:url" content="">
  
  <!-- PWA 配置 -->
  <meta name="theme-color" content="#667eea">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="照片时光机">
  
  <!-- 图标 -->
  <link rel="icon" type="image/svg+xml" href="./vite.svg">
  <link rel="alternate icon" href="./favicon.ico">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180">
  
  <!-- 字体预加载 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <title>Vue Photo Gallery - 照片时光机</title>
  
  <!-- 内联关键 CSS -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html {
      font-size: 16px;
      line-height: 1.6;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', sans-serif;
      background: #fafbfc;
      color: #2c3e50;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    /* 加载动画 */
    .app-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      z-index: 9999;
    }
    
    .loading-content {
      text-align: center;
      color: white;
    }
    
    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    
    .loading-text {
      font-size: 1.2rem;
      font-weight: 500;
      margin-bottom: 10px;
    }
    
    .loading-subtext {
      font-size: 0.9rem;
      opacity: 0.8;
    }
    
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    
    /* 隐藏未渲染内容 */
    #app:not(.mounted) {
      opacity: 0;
    }
    
    #app.mounted {
      opacity: 1;
      transition: opacity 0.5s ease;
    }
  </style>
</head>
<body>
  <!-- 加载动画 -->
  <div id="loading" class="app-loading">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <div class="loading-text">照片时光机</div>
      <div class="loading-subtext">正在加载您的照片记忆...</div>
    </div>
  </div>
  
  <!-- 应用根节点 -->
  <div id="app"></div>
  
  <!-- 应用脚本 -->
  <script type="module" src="./src/main.js"></script>
  
  <!-- 加载完成脚本 -->
  <script>
    // 监听应用加载完成
    window.addEventListener('DOMContentLoaded', () => {
      const loading = document.getElementById('loading');
      const app = document.getElementById('app');
      
      // 模拟加载时间
      setTimeout(() => {
        loading.style.opacity = '0';
        loading.style.transition = 'opacity 0.5s ease';
        
        setTimeout(() => {
          loading.style.display = 'none';
          app.classList.add('mounted');
        }, 500);
      }, 1500);
    });
    
    // PWA 支持（仅在生产环境下启用）
    if ('serviceWorker' in navigator && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('SW registered: ', registration);
          })
          .catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
      });
    }
    
    // 主题检测
    const savedTheme = localStorage.getItem('darkTheme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    
    if (savedTheme === 'true' || (!savedTheme && prefersDark)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
</body>
</html>
